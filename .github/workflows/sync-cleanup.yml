          MANIFEST_EOF

          total=$(wc -l < "$MANIFEST")
          echo "Манифест: $total путей к удалению."

          if [ "$MODE" = "full-sync" ]; then
            ZIP="RMG-sync-changes.zip"
            if [ ! -f "$ZIP" ]; then
              echo "::error::Файл $ZIP не найден в корне репозитория. Загрузите его через 'Add file -> Upload files' и запустите workflow заново, либо выберите режим 'delete-only'."
              exit 1
            fi
            entries=$(unzip -Z1 "$ZIP" | wc -l)
            echo "Применяю $ZIP ($entries файлов)..."
            unzip -o -q "$ZIP" -d .
          fi

          tr '\n' '\0' < "$MANIFEST" | xargs -0 -r git rm -f -q --ignore-unmatch --

          if [ "$MODE" = "full-sync" ]; then
            git rm -f -q --ignore-unmatch -- RMG-sync-changes.zip || true
            git add -A
          fi

          deleted=$(git diff --cached --name-only --diff-filter=D | wc -l)
          modified=$(git diff --cached --name-only --diff-filter=M | wc -l)
          added=$(git diff --cached --name-only --diff-filter=A | wc -l)
          echo "К коммиту: удалено $deleted, изменено $modified, добавлено $added."
          git diff --cached --name-only --diff-filter=D | sed 's/^/  удалён: /' || true

      - name: Commit and push
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -eu

          if git diff --cached --quiet; then
            echo "Изменений нет — репозиторий уже в целевом состоянии. Коммит не создан."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$MODE" = "full-sync" ]; then
            git commit -m "Sync with upstream Rosalie241/RMG (2026-07-29 - 2026-09-17)" \
                       -m "Automated by 'RMG Sync Cleanup' workflow: applied RMG-sync-changes.zip and removed obsolete files (mode: $MODE)."
          else
            git commit -m "3rdParty: remove bundled SDL_net and obsolete freetype files" \
                       -m "Automated by 'RMG Sync Cleanup' workflow (mode: $MODE)."
          fi

          git push
          echo "Готово: коммит $(git rev-parse --short HEAD) отправлен в ветку ${GITHUB_REF_NAME:-HEAD}."
