name: RMG Sync Cleanup

# =============================================================================
# Автоматическая очистка/применение синхронизации RMG с upstream
# (Rosalie241/RMG, коммиты 29.07 - 17.09.2026) прямо в репозитории,
# без локального клона.
#
# Режимы (выбираются в диалоге "Run workflow"):
#   delete-only (по умолчанию):
#       Удаляет 340 устаревших файлов (bundled SDL_net из коммита c684cd42
#       и freetype-заголовки GLideN64 из коммита 10f42e08) одним коммитом.
#       Используйте, если изменённые файлы вы уже заменили вручную.
#   full-sync:
#       Дополнительно применяет RMG-sync-changes.zip (141 изменённый +
#       15 новых файлов), загруженный в КОРЕНЬ репозитория через
#       "Add file -> Upload files". После применения zip удаляется
#       из репозитория. Итог: репозиторий полностью синхронизирован.
#
# Workflow идемпотентен: повторный запуск ничего не портит — при полном
# порядке просто выведет "Изменений нет".
# После завершения синхронизации этот файл можно удалить или оставить.
#
# ВАЖНО: файл должен лежать на ветке ПО УМОЛЧАНИЮ (master), иначе он не
# появится в списке Actions. Запускать — на ветке master.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'delete-only = только удалить 340 устаревших файлов; full-sync = также применить RMG-sync-changes.zip из корня репозитория'
        required: true
        default: 'delete-only'
        type: choice
        options:
          - delete-only
          - full-sync

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove obsolete files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply changes and remove obsolete files
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -eu

          TMP_DIR="${RUNNER_TEMP:-/tmp}"
          MANIFEST="$TMP_DIR/obsolete-files.txt"

          cat > "$MANIFEST" <<'MANIFEST_EOF'
          Source/3rdParty/SDL_net/.github/actions/setup-ninja/action.yml
